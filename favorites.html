<!DOCTYPE html>
<html>
<head>
  <title>My Favorites</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="favorites-hero">

  <div>
    <span class="hero-badge">
      ❤️ Saved Products
    </span>

    <h1>My Favorites</h1>

    <p>
      Quick access to products you love.
    </p>
  </div>

  <a href="index.html" class="back-btn">
    ← Products
  </a>

</header>
<div class="favorites-stats">

  <div class="summary-card">
    <strong id="favoriteCount">0</strong>
    <span>Favorites</span>
  </div>

</div>
  
<div id="favoritesList" class="favorite-grid"></div>
  <script>
(function () {
  const savedTheme = localStorage.getItem("theme");

  if (savedTheme) {
    document.documentElement.setAttribute(
      "data-theme",
      savedTheme
    );
  } else {
    const prefersDark = window.matchMedia(
      "(prefers-color-scheme: dark)"
    ).matches;

    document.documentElement.setAttribute(
      "data-theme",
      prefersDark ? "dark" : "light"
    );
  }
})();
</script>
<script>
  function removeFavorite(barcode){

  let favorites =
    JSON.parse(localStorage.getItem("favorites") || "[]");

  favorites = favorites.filter(
    item => item.barcode !== barcode
  );

  localStorage.setItem(
    "favorites",
    JSON.stringify(favorites)
  );

  location.reload();
}
const favorites =
  JSON.parse(localStorage.getItem("favorites") || "[]");
  document.getElementById("favoriteCount").textContent =
  `(${favorites.length})`;
const container =
  document.getElementById("favoritesList");

if(!favorites.length){

container.innerHTML = `
<div class="empty-favorites">

  <div class="empty-icon">❤️</div>

  <h2>No Favorites Yet</h2>

  <p>
    Start adding products to your favorites.
  </p>

  <a href="index.html" class="btn-primary">
    Browse Products
  </a>

</div>
`;

return;
}else{

  container.innerHTML = favorites.map(item => `
  <article class="favorite-card">

    <a href="product.html?barcode=${item.barcode}">
      <img
        src="${item.image}"
        alt="${item.name}"
        class="favorite-image">
    </a>

    <div class="favorite-content">

      <h3>${item.name}</h3>

      <p class="favorite-barcode">
        📦 ${item.barcode}
      </p>

      <div class="favorite-actions">

        <a
          href="product.html?barcode=${item.barcode}"
          class="btn-primary">
          View Product
        </a>

        <button
          class="btn-danger"
          onclick="removeFavorite('${item.barcode}')">
          Remove
        </button>

      </div>

    </div>

  </article>
`).join("");

}
</script>

</body>
</html>
