<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product barcode lookup and buying options">
<meta name="keywords" content="barcode, product, shopping">
<title>Product Details</title>
<link rel="stylesheet" href="style.css">
<style>
body{
  font-family:Arial,sans-serif;
  max-width:900px;
  margin:40px auto;
  padding:20px;
}

.product-image{
  max-width:300px;
  width:100%;
}

</style>
</head>
<body>
<div class="product-details">

  <img id="productImage" class="product-image" src="" alt="">

  <div class="product-info">

    <h1 id="productName">Loading...</h1>

    <div class="product-card-info">

      <div class="info-row">
        <span class="info-label">🏷️ Category</span>
        <span id="productCategory"></span>
      </div>

      <div class="info-row">
        <span class="info-label">📦 Barcode</span>
        <span id="productBarcode"></span>
      </div>

    </div>

    <div class="action-buttons">

      <button id="copyBarcodeBtn" class="btn-primary">
        📋 Copy Barcode
      </button>

      <button id="shareBtn" class="btn-primary">
        📤 Share Product
      </button>

    </div>

    <h3 class="section-title">🛒 Buy Online</h3>
    <div id="buyLinks"></div>

    <h3 class="section-title">🔥 Related Products</h3>
    <div id="relatedProducts"></div>

    <p>
      <a href="index.html" class="btn-primary">
        Back to Products
      </a>
    </p>

  </div>

</div>

<script src="products-data.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const barcode = params.get("barcode");

const product = (window.SAMPLE_PRODUCTS || []).find(function(item){
  return String(item.barcode) === String(barcode);
});

if(product){
  document.title = `${product.name} | Products & Barcode`;
  const metaDescription = document.querySelector('meta[name="description"]');

if(metaDescription){
  metaDescription.setAttribute(
    "content",
    `${product.name} barcode ${product.barcode || ""} category ${product.category || ""}`
  );
}
  document.getElementById("productName").textContent =
    product.name.toUpperCase();

  document.getElementById("productImage").src =
    product.image;

  document.getElementById("productImage").alt =
    product.name;

  document.getElementById("productBarcode").textContent =
    product.barcode || "No barcode";

  document.getElementById("productCategory").textContent =
    product.category;
  document.getElementById("copyBarcodeBtn").onclick = function(){
  navigator.clipboard.writeText(product.barcode);
  alert("Barcode copied!");
};
  document.getElementById("shareBtn").onclick = function(){
  navigator.share({
    title: product.name,
    url: location.href
  });
};
  const related = (window.SAMPLE_PRODUCTS || [])
  .filter(p => p.category === product.category && p.name !== product.name)
  .slice(0,4);

document.getElementById("relatedProducts").innerHTML =
  related.map(p => `
    <a href="product.html?barcode=${p.barcode}">
      ${p.name}
    </a><br>
  `).join("");
  const search = encodeURIComponent(product.name);

const icons = {
  "amazon-sa": "https://www.google.com/s2/favicons?domain=amazon.sa&sz=64",
  "noon": "https://www.google.com/s2/favicons?domain=noon.com&sz=64",
  "alibaba": "https://www.google.com/s2/favicons?domain=alibaba.com&sz=64",
  "aliexpress": "https://www.google.com/s2/favicons?domain=aliexpress.com&sz=64"
};

document.getElementById("buyLinks").innerHTML = `
<a class="btn-primary" target="_blank"
   href="https://www.amazon.sa/s?k=${search}">
   <img src="${icons['amazon-sa']}" width="20" height="20">
   Amazon
</a>

<a class="btn-primary" target="_blank"
   href="https://www.noon.com/saudi-en/search/?q=${search}">
   <img src="${icons['noon']}" width="20" height="20">
   Noon
</a>

<a class="btn-primary" target="_blank"
   href="https://www.alibaba.com/trade/search?SearchText=${search}">
   <img src="${icons['alibaba']}" width="20" height="20">
   Alibaba
</a>

<a class="btn-primary" target="_blank"
   href="https://www.aliexpress.com/wholesale?SearchText=${search}">
   <img src="${icons['aliexpress']}" width="20" height="20">
   AliExpress
</a>
`;
  
}else{
  document.getElementById("productName").textContent =
    "Product Not Found";
}
  document.querySelectorAll('.btn-primary').forEach(btn => {

    btn.addEventListener('mouseenter', () => {

        btn.classList.remove('glow');

        setTimeout(() => {
            btn.classList.add('glow');
        }, 10);

        setTimeout(() => {
            btn.classList.remove('glow');
        }, 1200);

    });

});
</script>

</body>
</html>
