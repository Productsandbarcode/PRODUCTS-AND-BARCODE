<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>

<style>
body{
  font-family:Arial,sans-serif;
  max-width:900px;
  margin:40px auto;
  padding:20px;
}

.product-image{
  max-width:300px;
  width:100%;
}

.buy-btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 20px;
  background:#0d6efd;
  color:white;
  text-decoration:none;
  border-radius:8px;
}
</style>
</head>
<body>

<div class="product-details">

  <img id="productImage" class="product-image" src="" alt="">

  <div class="product-info">

    <h1 id="productName">Loading...</h1>

    <p>
      <strong>Barcode:</strong>
      <span id="productBarcode"></span>
    </p>

    <p>
      <strong>Category:</strong>
      <span id="productCategory"></span>
    </p>

    <div id="buyLinks"></div>

    <p>
      <a href="index.html" class="btn-primary">
        Back to Products
      </a>
    </p>

  </div>

</div>

<script src="products-data.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const barcode = params.get("barcode");

const product = (window.SAMPLE_PRODUCTS || []).find(function(item){
  return String(item.barcode) === String(barcode);
});

if(product){
  document.title = product.name;

  document.getElementById("productName").textContent =
    product.name.toUpperCase();

  document.getElementById("productImage").src =
    product.image;

  document.getElementById("productImage").alt =
    product.name;

  document.getElementById("productBarcode").textContent =
    product.barcode || "No barcode";

  document.getElementById("productCategory").textContent =
    product.category;
  const search = encodeURIComponent(product.name);

document.getElementById("buyLinks").innerHTML = `
  <a class="btn-primary" target="_blank"
     href="https://www.amazon.sa/s?k=${search}">
     Amazon
  </a>

  <a class="btn-primary" target="_blank"
     href="https://www.noon.com/saudi-en/search/?q=${search}">
     Noon
  </a>

  <a class="btn-primary" target="_blank"
     href="https://www.alibaba.com/trade/search?SearchText=${search}">
     Alibaba
  </a>

  <a class="btn-primary" target="_blank"
     href="https://www.aliexpress.com/wholesale?SearchText=${search}">
     AliExpress
  </a>
`;
  const search = encodeURIComponent(product.name);

document.body.innerHTML += `
<hr>

<h2>Buy Online</h2>

<p>
<a href="https://www.amazon.sa/s?k=${search}" target="_blank">Amazon</a>
</p>

<p>
<a href="https://www.noon.com/saudi-en/search/?q=${search}" target="_blank">Noon</a>
</p>

<p>
<a href="https://www.alibaba.com/trade/search?SearchText=${search}" target="_blank">Alibaba</a>
</p>

<p>
<a href="https://www.aliexpress.com/wholesale?SearchText=${search}" target="_blank">AliExpress</a>
</p>
`;
}else{
  document.getElementById("productName").textContent =
    "Product Not Found";
}
</script>

</body>
</html>
